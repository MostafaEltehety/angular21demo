<mat-paginator [pageSizeOptions]="[5, 10, 20]" ></mat-paginator>

<table mat-table [dataSource]="dataSource" class="card" >

<!--
يحتوي على تعريف عمود واحد.
كل عمود له Header Cell و Cell.
-->
  <ng-container matColumnDef="id">
<th mat-header-cell *matHeaderCellDef>{{'Num'|translate}}</th>
<td mat-cell *matCellDef="let u">{{u.id}}</td>
  </ng-container>

  <ng-contrainer matColumnDef="name">
<th mat-header-cell *matHeaderCellDef>{{'FULL_NAME'|translate}}</th>
<td mat-cell *matCellDef="let u">{{u.name}}</td>
  </ng-contrainer>

  <ng-contrainer matColumnDef="username">
<th mat-header-cell *matHeaderCellDef>{{'USER_NAME'|translate}}</th>
<td mat-cell *matCellDef="let u">{{u.username}}</td>
  </ng-contrainer>

    <ng-contrainer matColumnDef="address">
<th mat-header-cell *matHeaderCellDef>{{'address'|translate}}</th>
<td mat-cell *matCellDef="let u">{{u.address.street}}</td>
  </ng-contrainer>

<!-- يمثل صفوف الجدول:

Header Row: العناوين

Row: كل صف بيانات -->

  <tr mat-header-row *matHeaderRowDef="displayCol"></tr>
  <tr mat-row *matRowDef="let row;columns:displayCol"></tr>
</table>
