 <div class="container-fluid">
  <div class="row justify-content-center">
    @for (product of products(); track product.id) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3 m-3">
        <mat-card class="product-card h-100 d-flex flex-column">
          <mat-card-header>
            <!-- <mat-card-title>{{ product.name | textTrim:2 }}</mat-card-title> -->
            <mat-card-title>{{ product.name }}</mat-card-title>
          </mat-card-header>
<hr  class="w-100 mb-4">
          <img mat-card-image [src]="product.image" [alt]="product.name">

          <mat-card-content class="flex-grow-1">
            <div class="mb-2">
              <mat-label class="fw-bold">{{'CATEGORY'|translate}}: </mat-label>
              <span>{{product.category}}</span>
            </div>

            <div class="mb-2">
              <mat-label class="fw-bold">{{'PRICE'|translate}}: </mat-label>
              <span  >{{product.price | currency:'EGP '}}</span>
            </div>

            <div class="mb-2">
              <mat-label class="fw-bold">{{'INSTOKE'|translate}}: </mat-label>
              <span >
                {{product.stock}}
              </span>
            </div>
          </mat-card-content>

          <hr width="100%">
          <mat-card-actions class="d-flex justify-content-around mt-auto">
            <button mat-icon-button
                    [matTooltip]="'ADDTOCARD'|translate"
                    [disabled]="product.stock === 0">
              <mat-icon>shopping_cart</mat-icon>
            </button>
            <button mat-icon-button
                    [matTooltip]="'FAVORITE'|translate"
                    class="text-danger">
              <mat-icon>favorite</mat-icon>
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    }
  </div>
</div>
