<mat-toolbar>

  <div class="toolbar-actions">
<button
  [matTooltip]="menuServices.curentLanguage() === 'ar' ? 'English' : 'عربى'"
  mat-icon-button
  (click)="menuServices.SwitchLang()"
  class="lang-btn">
  <mat-icon>language</mat-icon>
  <span class="lang-indicator">{{ menuServices.curentLanguage() === 'ar' ? 'EN' : 'ع' }}</span>
</button>

    <!-- Theme Toggle -->
    <button

[matTooltip]="menuServices.getThemeTooltip()"

    mat-icon-button
      (click)="menuServices.toggleTheme()"
      class="toolbar-btn theme-toggle-btn"
      [class.dark-mode]="menuServices.themeService.isDarkMode()">
      <mat-icon>{{ menuServices.getThemeIcon() }}</mat-icon>
    </button>

    <!-- Profile Menu -->
    <button
      [matTooltip]="'PROFILE' | translate"
      mat-icon-button
      [matMenuTriggerFor]="menuId"
      class="toolbar-btn">
      <mat-icon>person</mat-icon>
    </button>
  </div>


    <mat-menu #menuId>
    <div mat-menu-item class="list-item-content">
      <mat-icon>account_box</mat-icon>
      <span>Eltehety</span>
    </div>
    <div mat-menu-item class="list-item-content" routerLink="/login">
      <mat-icon>exit_to_app</mat-icon>
      <span>{{ 'LOGOUT' | translate }}</span>
    </div>
  </mat-menu>

  <div>
    <button mat-flat-button routerLink="/auth/login" routerLinkActive="active-link">
      {{'LOGIN'|translate}}</button>
    <button mat-flat-button routerLink="/auth/signup" routerLinkActive="active-link">
      {{'SIGNUP'|translate}}</button>
  </div>
  <button mat-icon-button> <mat-icon>storefront</mat-icon></button>
</mat-toolbar>
<router-outlet></router-outlet>
