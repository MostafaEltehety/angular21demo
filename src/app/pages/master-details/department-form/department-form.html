
<div class="card">
  <h3 class="card-title">Add New Department</h3>

  <div class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Course Title</mat-label>
      <input matInput placeholder="Enter course title" #title />
      <mat-hint align="end">Course title mat-hint</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput rows="4" placeholder="Enter course description"></textarea>
    </mat-form-field>

    <div class="actions">
      <button mat-raised-button class="card-button">Save</button>
    </div>
  </div>
</div>
