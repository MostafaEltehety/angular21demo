<button mat-flat-button (click)="openDialoge()">
  <mat-icon>add_circle</mat-icon>
  {{'ADD_DEPARTMENT'|translate}}
</button>
<br>
<hr><br>
<!-- <div class="container" style="width: 50%;"> -->
<div class="container">
  <div class="card w-100">
    <div class="card-header">
      <h5 class="card-title">{{'DEPARTMENT'|translate}}</h5>
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" />
      </mat-form-field>
    </div>

    <div class="card w-100">
      <!--matSort: Makes the table sortable-->
      <table mat-table [dataSource]="departmentsDataSource" matSort>
        <!--matColumnDef (Material Column Definition): unique column identifier-->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>{{'Num'|translate}}</th>
          <!--*matCellDef (Material Cell Definition)-->
          <td mat-cell *matCellDef="let department">{{department.id}}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>{{'DEPARTMENT_NAME'|translate}}</th>
          <!--*matCellDef (Material Cell Definition)-->
          <td mat-cell *matCellDef="let department">{{department.name}}</td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>{{'Description'|translate}}</th>
          <!--*matCellDef (Material Cell Definition)-->
          <td mat-cell *matCellDef="let department">{{department.description}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
        <tr mat-row *matRowDef="let deptRow; columns:displayColumns"></tr>
      </table>
    </div>

    <div class="card-footer">
      <mat-paginator showFirstLastButtons [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
    </div>
  </div>
</div>
