<div class="card">
<div class="card-title text-center">
  {{'ADD_DEPARTMENT'|translate}}
</div>

  <form [formGroup]="from" (submit)="save()" class="form">
<mat-form-field appearance="outline" class="w-100">
<mat-label>{{'DEPARTMENT_NAME'|translate}}</mat-label>
<input matInput formControlName="name" placeholder="{{'DEPARTMENT_NAME'|translate}}">
@if(from.get('name')?.invalid){
<mat-error>{{"REQUIRED"|translate}}</mat-error>
}
</mat-form-field>

<mat-form-field class="w-100" appearance="outline">
<mat-label>{{"DEPARTMENT_DESC"|translate}}</mat-label>
<textarea matInput rows="4" formControlName="description"></textarea>
@if(from.get('description')?.invalid){
<mat-error>{{"REQUIRED"|translate}}</mat-error>
}
</mat-form-field>

</form>


<div class="actions">

  <button mat-flat-button [ngClass]="{'btn-primary':from.valid}" [disabled]="from.invalid">

    {{ 'SAVE' | translate }}
  </button>

 <button mat-raised-button class="btn-warn" (click)="Close()">

    {{ 'Cancel' | translate }}
  </button>


</div>

</div>
