<div class="card">
  <div class="card-title">
{{'LOGIN'|translate}}
  </div>

<form [formGroup]="form"  class="form">
<mat-form-field appearance="outline">
<mat-label>{{'USER_NAME'|translate}}</mat-label>
<input matInput formControlName="userName" placeholder="{{'USER_NAME'|translate}}">
@if(form.get('userName')?.invalid){
  <mat-error>{{'REQUIRED'|translate}}</mat-error>
}
</mat-form-field>
<mat-form-field appearance="outline">
<mat-label>{{'PASSWORD'|translate}}</mat-label>
<input matInput placeholder="{{'PASSWORD'|translate}}" formControlName="password" type="password">
@if(form.get('password')?.invalid){
<mat-error>{{'REQUIRED'|translate}}</mat-error>
}
</mat-form-field>


<div class="actions">

   <button mat-stroked-button (click)="openSnackBar()" [ngClass]="{'btn-primary':form.valid}" [disabled]="form.invalid">

    {{'LOGIN'|translate}}

  </button>

    <button mat-stroked-button class="btn-warn" >

    {{'Cancel'|translate}}</button>

</div>



</form>

</div>
