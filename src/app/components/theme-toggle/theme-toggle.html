  @if (variant === 'icon-button') {
      <!-- Variant 1: Icon Button (Default) -->
      <button
        mat-icon-button
        (click)="toggleTheme()"
        class="theme-toggle-icon"
        [matTooltip]="getTooltipText()">
        @if (themeService.isDarkMode()) {
          <mat-icon>light_mode</mat-icon>
        } @else {
          <mat-icon>dark_mode</mat-icon>
        }
      </button>
    }

    @if (variant === 'text-button') {
      <!-- Variant 2: Text Button -->
      <button
        mat-stroked-button
        (click)="toggleTheme()"
        class="theme-toggle-text">
        <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        {{ themeService.isDarkMode() ? 'Light Mode' : 'Dark Mode' }}
      </button>
    }

    @if (variant === 'toggle-switch') {
      <!-- Variant 3: Slide Toggle -->
      <div class="theme-toggle-switch">
        <mat-icon class="sun-icon">light_mode</mat-icon>
        <mat-slide-toggle
          [checked]="themeService.isDarkMode()"
          (change)="toggleTheme()"
          color="primary"
          [matTooltip]="getTooltipText()">
        </mat-slide-toggle>
        <mat-icon class="moon-icon">dark_mode</mat-icon>
      </div>
    }

    @if (variant === 'fab') {
      <!-- Variant 4: Floating Action Button -->
      <button
        mat-fab
        (click)="toggleTheme()"
        class="theme-toggle-fab"
        [matTooltip]="getTooltipText()"
        [color]="themeService.isDarkMode() ? 'accent' : 'primary'">
        <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    }

    @if (variant === 'mini-fab') {
      <!-- Variant 5: Mini FAB -->
      <button
        mat-mini-fab
        (click)="toggleTheme()"
        class="theme-toggle-mini-fab"
        [matTooltip]="getTooltipText()">
        <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    }

    @if (variant === 'menu') {
      <!-- Variant 6: Menu Button -->
      <button
        mat-icon-button
        [matMenuTriggerFor]="themeMenu"
        [matTooltip]="'Change Theme'">
        <mat-icon>palette</mat-icon>
      </button>
      <mat-menu #themeMenu="matMenu">
        <button mat-menu-item (click)="setTheme('light')">
          <mat-icon [class.active]="!themeService.isDarkMode()">light_mode</mat-icon>
          <span>Light Mode</span>
        </button>
        <button mat-menu-item (click)="setTheme('dark')">
          <mat-icon [class.active]="themeService.isDarkMode()">dark_mode</mat-icon>
          <span>Dark Mode</span>
        </button>
        <button mat-menu-item (click)="setTheme('auto')">
          <mat-icon>auto_mode</mat-icon>
          <span>Auto (System)</span>
        </button>
      </mat-menu>
    }

    @if (variant === 'animated') {
      <!-- Variant 7: Animated Toggle -->
      <button
        mat-icon-button
        (click)="toggleTheme()"
        class="theme-toggle-animated"
        [class.dark]="themeService.isDarkMode()">
        <div class="icon-wrapper">
          <mat-icon class="sun">light_mode</mat-icon>
          <mat-icon class="moon">dark_mode</mat-icon>
        </div>
      </button>
    }
